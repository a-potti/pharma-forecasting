[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast"
version = "0.1.0"
description = "US pharmaceutical revenue forecasting for a multi-indication asset"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "SALib>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
app = ["streamlit>=1.30", "altair>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
